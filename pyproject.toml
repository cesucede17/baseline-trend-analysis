[project]
name = "palbe-demo"
version = "5.0.0"
description = "PALBE v4 — ML Training UI with Project/Session Management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.9.0",
    "plotly>=6.7.0,<7",
    "openpyxl>=3.1.0",
    "joblib>=1.4.0",
    "scipy>=1.13.0",
    "anthropic>=0.40.0",
    "python-multipart>=0.0.9",
    "lightgbm>=4.5.0",
    "xgboost>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "kaleido==0.2.1",
    "passlib[bcrypt]>=1.7.0",
    "itsdangerous>=2.1.0",
    "psutil>=5.9.0",
    "authlib>=1.3.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
